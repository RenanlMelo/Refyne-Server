spring.application.name=refyne
server.port=8000

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=refyne;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
